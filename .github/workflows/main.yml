name: Unit Tests

on:
  push:
    branches:
      - main
      - testnet
  pull_request:
    branches: [master, testnet]

jobs:
  Jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Run Tests
        run: |
          bun install --frozen-lockfile
          bun test
